# This is a basic workflow to help you get started with Actions
name: Patch LOWGMOD APK

on:
  workflow_dispatch:

jobs:
  patch-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download original APK
        run: |
          mkdir -p downloads
          wget -O downloads/LOWGMOD-ANDROID-8.2.104.apk https://cdn.jsdelivr.net/gh/LOWGMOD-patcher/LOWGMOD-ANDROID-8.2.104.apk
      
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y wget openjdk-17-jdk
          wget -O apktool.jar "https://ibotpeaches.github.io/apktool/downloads/latest/apktool.jar"
          chmod +x apktool.jar
          export PATH="$PATH:$(pwd)"
      
      - name: Decompile APK
        run: |
          java -jar apktool.jar d downloads/LOWGMOD-8.2.104.apk -o decompiled
      
      - name: Replace key server URLs
        run: |
          find decompiled -name "*.smali" -exec sed -i 's|https://key.tsclowgmod.com|https://disabled-mod.example.com|g' {} \\;
          sed -i 's|https://key.tsclowgmod.com|https://disabled-mod.example.com|g' decompiled/lib/arm64-v8a/liblowgmod.so
      
      - name: Rebuild APK
        run: |
          java -jar apktool.jar b decompiled -o downloads/patched-unsigned.apk
      
      - name: Sign APK with debug keystore
        run: |
          keytool -genkeypair \\
            -keystore debug.keystore \\
            -alias androiddebugkey \\
            -storetype PKCS12 \\
            -validity 9999 \\
            -dname "cn=Android" \\
            -keyalg RSA -keysize 2048 \\
            -storepass android -keypass android > /dev/null 2>&1 || true
          apksigner sign \\
            --ks debug.keystore \\
            --ks-pass pass:android \\
            --ks-key-alias androiddebugkey \\
            --key-pass pass:android \\
            --out downloads/patched-signed.apk \\
            downloads/patched-unsigned.apk
      
      - name: Zip-align APK
        run: |
          sudo apt-get install -y zipalign
          zipalign -f -v 4 downloads/patched-signed.apk downloads/LOWGMOD-patched-final.apk
      
      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: LOWGMOD-patched-disabled-keys
          path: downloads/LOWGMOD-patched-final.apk
name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
